    - { name: FormField, path: frontend/src/components/shared/FormField.tsx, request: R10 }
    - { name: Toast, path: frontend/src/components/shared/Toast.tsx, request: R10 }
    - { name: Skeleton, path: frontend/src/components/shared/Skeleton.tsx, request: R10 }
    - { name: Pagination, path: frontend/src/components/shared/Pagination.tsx, request: R10 }
    - { name: Avatar, path: frontend/src/components/shared/Avatar.tsx, request: R10 }
    - { name: StatCard, path: frontend/src/components/features/StatCard.tsx, request: R10 }
    - { name: Timeline, path: frontend/src/components/features/requests/Timeline.tsx, request: R10 }
    - { name: LoadingButton, path: frontend/src/components/shared/LoadingButton.tsx, request: R11 }
    - { name: DialogFocus, path: frontend/src/components/shared/DialogFocus.tsx, request: R6 }
