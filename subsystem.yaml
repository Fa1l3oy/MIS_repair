# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-repair          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.0.0"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3002       # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: http://localhost:3000
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/callback

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
# อาคาร (buildings): ทุก role อ่านได้ · เพิ่มได้เฉพาะผู้ดูแลระบบ (core admin → ADMIN)
probes:
  collection: /api/v1/buildings
  not_found: /api/v1/buildings/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/buildings/not-a-uuid
  create:
    path: /api/v1/buildings
    allowed_role: admin
    denied_role: student
    invalid_body:
      name: ""
    valid_body:
      name: Conformance Probe

owners:
  pl: "@csmju2030/pl-repair"
  aie: "@csmju2030/aie-repair"

display_name: "ระบบแจ้งซ่อม"
repo: github.com/CSMJU2030/csmju-repair
status: proposed

# ---- หน้าจอ (ui-design-system.md ข้อ 17.0, 19.2) ----
# ช่วงเปลี่ยนผ่าน: ยังไม่มี package @csmju2030/design-system จึงยังไม่มี design_system_version
# ของกลางคัดลอกจาก template ด้านล่างโดยไม่แก้ (frontend/src/csmju · app/globals.css · public/csmju-logo.png)
ui:
  template: csmju-core-hub/templates/csmju-subsystem-web@73ae729
  ui_design_system: "1.3.0"
  theme: light
  nav:
    - { label: "ภาพรวม", path: "/" }
    - { label: "ใบแจ้งซ่อมของฉัน", path: "/requests" }
    - { label: "คิวงานซ่อม", path: "/queue" }                  # ช่าง · ผู้ดูแล
    - { label: "สถิติงานซ่อม", path: "/dashboard" }            # ช่าง · ผู้ดูแล
    - { label: "การแจ้งเตือน", path: "/notifications" }
    - { label: "ผู้ใช้และช่าง", path: "/admin/users" }         # ผู้ดูแล
    - { label: "อาคาร", path: "/admin/buildings" }             # ผู้ดูแล
    - { label: "หมวดหมู่งานซ่อม", path: "/admin/categories" }  # ผู้ดูแล
    - { label: "สติกเกอร์ QR", path: "/admin/qr-tags" }        # ผู้ดูแล
  # component ชั่วคราวที่ template ยังไม่มี — คำขอตามข้อ 17.4 อยู่ใน docs/design-system-requests.md (ยังไม่มีเลข issue)
  local_components:
